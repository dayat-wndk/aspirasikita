{% extends 'base.html' %}{% block title %}Buat Laporan{% endblock %}{% block content %}<div class="page-heading"><div><span class="eyebrow">FORMULIR PENGADUAN</span><h1>Sampaikan aspirasi</h1><p class="muted">Jelaskan masalah atau usulanmu secara jelas agar mudah ditindaklanjuti.</p></div></div><section class="content-card form-card"><form method="post" enctype="multipart/form-data" class="form report-form"><div class="form-grid"><div class="field-wide"><label>Judul laporan *</label><input name="title" required maxlength="180" placeholder="Contoh: Lampu jalan mati di sekitar taman"></div><div><label>Kategori *</label><select name="category" required><option value="">Pilih kategori</option>{% for c in ['Infrastruktur','Lingkungan','Pelayanan Publik','Keamanan','Sosial','Aspirasi','Lainnya'] %}<option>{{ c }}</option>{% endfor %}</select></div><div><label>Lokasi kejadian *</label><input name="location" required maxlength="255" placeholder="Alamat atau patokan lokasi"></div><div class="field-wide"><label>Deskripsi lengkap *</label><textarea name="description" rows="6" required placeholder="Ceritakan apa yang terjadi, sejak kapan, dan dampaknya..."></textarea></div><div class="field-wide"><label>Bukti foto (opsional)</label><input type="file" name="evidence" accept=".png,.jpg,.jpeg,.webp"><small class="help-text">Format PNG/JPG/WEBP, ukuran maksimal 5 MB.</small></div></div><div class="form-actions"><a class="button secondary" href="{{ url_for('dashboard') }}">Batal</a><button class="button primary" type="submit">Kirim laporan <span>→</span></button></div></form></section>{% endblock %}
